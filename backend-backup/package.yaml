name: haskell-servant-realworld
version: 0.1.0.0
author: Antigravity
synopsis: RealWorld Conduit API backend
description: RealWorld Conduit API backend using Servant, Postgres, Persistent, and Esqueleto.

dependencies:
  - base
  - aeson
  - bytestring
  - containers
  - crypton
  - esqueleto
  - appendmap
  - http-types
  - jose
  - lens
  - monad-logger
  - mtl
  - persistent
  - persistent-postgresql
  - persistent-template
  - resource-pool
  - servant-auth
  - servant-auth-server
  - servant-server
  - text
  - time
  - transformers
  - wai
  - wai-cors
  - wai-extra
  - warp
  - password
  - directory
  - filepath
  - effectful
  - effectful-core
  - unliftio
  - openapi3
  - servant-openapi3
  - servant-swagger-ui
  - insert-ordered-containers
  - raw-strings-qq
  - http-api-data

default-extensions:
  - BlockArguments
  - DataKinds
  - DeriveAnyClass
  - DeriveGeneric
  - DerivingStrategies
  - EmptyDataDecls
  - FlexibleContexts
  - FlexibleInstances
  - GADTs
  - GeneralizedNewtypeDeriving
  - ImportQualifiedPost
  - LambdaCase
  - MultiParamTypeClasses
  - OverloadedStrings
  - QuasiQuotes
  - RankNTypes
  - ScopedTypeVariables
  - StandaloneDeriving
  - TemplateHaskell
  - TypeFamilies
  - TypeOperators
  - UndecidableInstances
  - DuplicateRecordFields
  - OverloadedRecordDot
  - NoFieldSelectors
  - TypeApplications

ghc-options:
  - -Wall
  - -Wno-name-shadowing

library:
  source-dirs: src

executables:
  haskell-servant-realworld-exe:
    main: Main.hs
    source-dirs: app/server
    dependencies:
      - haskell-servant-realworld

  migrate-exe:
    main: Main.hs
    source-dirs: app/migrate
    dependencies:
      - haskell-servant-realworld

tests:
  haskell-servant-realworld-test:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - haskell-servant-realworld
      - hspec

