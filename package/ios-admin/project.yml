name: SentinelAdmin
options:
  bundleIdPrefix: tech.rinn7e
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
# Local Swift packages, one module each (the npm packages of the web app)
packages:
  TeaCup:
    path: lib/TeaCup
  TeaCupPagination:
    path: lib/TeaCupPagination
  SentinelAdminModules:
    path: .
targets:
  SentinelAdmin:
    type: application
    platform: iOS
    sources:
      - path: src
        # The folders of the modules of Package.swift
        excludes:
          - Theme
          - Common
    dependencies:
      - package: TeaCup
      - package: TeaCupPagination
      - package: SentinelAdminModules
        product: Theme
      - package: SentinelAdminModules
        product: Common
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sentinel
        UILaunchScreen: {}
        ApiBase: $(API_BASE)
        CFBundleURLTypes:
          - CFBundleURLName: tech.rinn7e.sentinel-admin
            CFBundleURLSchemes: [sentinel]
        # The API on this Mac is plain HTTP on localhost
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.rinn7e.sentinel-admin
        TARGETED_DEVICE_FAMILY: "1,2"
        API_BASE: "http:/$()/localhost:3000/api"
