name: SentinelAdmin
options:
  bundleIdPrefix: tech.rinn7e
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
# The modules of the app (Package.swift)
packages:
  SentinelAdminModules:
    path: .
targets:
  SentinelAdmin:
    type: application
    platform: iOS
    sources:
      - path: src/Root.swift
    dependencies:
      - package: SentinelAdminModules
        product: Program
      - package: SentinelAdminModules
        product: Package_TeaCup_Program
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sentinel
        UILaunchScreen: {}
        ApiBase: $(API_BASE)
        CFBundleURLTypes:
          - CFBundleURLName: tech.rinn7e.sentinel-admin
            CFBundleURLSchemes: [sentinel]
        # The API on this Mac is plain HTTP on localhost
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.rinn7e.sentinel-admin
        # The module of Root.swift, named like the other files of the app layer
        PRODUCT_MODULE_NAME: Root
        TARGETED_DEVICE_FAMILY: "1,2"
        API_BASE: "http:/$()/localhost:3000/api"
