name: Build and Cache Docker Image

on:
  workflow_dispatch:

# Grant permissions to write the built Docker image to GitHub Packages
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: |
            package/frontend-web/pnpm-lock.yaml
            package/frontend-admin/pnpm-lock.yaml

      - name: Configure GitHub Packages Authentication
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> package/frontend-web/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> package/frontend-admin/.npmrc

      - name: Build frontend-web
        run: |
          cd package/frontend-web
          pnpm install --no-frozen-lockfile
          VITE_BASE_URL=/ VITE_API_BASE=/api pnpm run build

      - name: Build frontend-admin
        run: |
          cd package/frontend-admin
          pnpm install --no-frozen-lockfile
          VITE_BASE_URL=/admin/ VITE_API_BASE=/api pnpm run build

      - name: Assemble static assets for Docker
        run: |
          mkdir -p package/backend/dist/web package/backend/dist/admin
          cp -R package/frontend-web/dist/* package/backend/dist/web/
          cp -R package/frontend-admin/dist/* package/backend/dist/admin/
          git add -f package/backend/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logs into GitHub Container Registry (GHCR) using the repository's built-in token
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Install Nix on the runner to support caching/warmup
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12
        with:
          extra-conf: |
            substituters = https://cache.nixos.org https://cache.iog.io
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=

      # Magic Nix Cache (caches evaluation data)
      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8
        with:
          use-flakehub: false

      # Build the Docker image natively using Nix.
      # This generates a tarball containing the layered Docker image.
      - name: Build Docker Image via Nix
        run: |
          nix build path:./package/backend#dockerImage \
            --extra-experimental-features "nix-command flakes" \
            --option sandbox false \
            --option filter-syscalls false

      # Load the Nix-built Docker image archive into the runner's Docker daemon,
      # tag it correctly to lowercase GHCR registry syntax, and push it!
      - name: Load, Tag, and Push Docker Image
        run: |
          docker load -i result
          
          # Convert repository name to lowercase for GHCR compatibility
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          docker tag realworld-api:latest $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest
