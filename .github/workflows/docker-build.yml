name: Build and Cache Docker Image

# Triggered manually via the GitHub Actions Tab in the browser
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: |
            frontend-web/pnpm-lock.yaml
            frontend-admin/pnpm-lock.yaml

      - name: Configure GitHub Packages Authentication
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> frontend-web/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> frontend-admin/.npmrc

      - name: Build frontend-web
        run: |
          cd frontend-web
          pnpm install --no-frozen-lockfile
          VITE_BASE_URL=/ VITE_API_BASE=/api pnpm run build

      - name: Build frontend-admin
        run: |
          cd frontend-admin
          pnpm install --no-frozen-lockfile
          VITE_BASE_URL=/admin/ VITE_API_BASE=/api pnpm run build

      - name: Assemble static assets for Docker
        run: |
          mkdir -p backend/dist/web backend/dist/admin
          cp -R frontend-web/dist/* backend/dist/web/
          cp -R frontend-admin/dist/* backend/dist/admin/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logs into GitHub Container Registry (GHCR) using the repository's built-in token
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds the Docker image and pushes it to GHCR.
      # Uses GitHub Actions cache (gha) to cache the Nix compiler dependencies.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
