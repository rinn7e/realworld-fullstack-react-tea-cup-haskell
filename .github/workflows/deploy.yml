name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend-web

      - name: Build
        run: pnpm build
        working-directory: frontend-web
        env:
          VITE_API_BASE: https://api.realworld.show/api
          VITE_BASE_URL: /realworld-fullstack-react-tea-cup-haskell/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
